<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Networks Auto-Poster</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

  header { background: #1a1d2e; border-bottom: 1px solid #2a2d3e; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 700; color: #fff; }
  header .subtitle { font-size: 13px; color: #888; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 16px; }

  /* Platform Grid */
  .platforms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 32px; }

  .platform-card {
    background: #1a1d2e;
    border: 1px solid #2a2d3e;
    border-radius: 12px;
    padding: 16px;
    transition: border-color 0.2s;
  }
  .platform-card:hover { border-color: #3a3d4e; }
  .platform-card.connected { border-color: #1d6b3f; }

  .platform-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .platform-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .platform-name { font-weight: 600; font-size: 15px; }

  .status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; padding: 3px 8px; border-radius: 20px;
    margin-bottom: 12px;
  }
  .status-badge.connected { background: #0d3320; color: #4caf7d; }
  .status-badge.not_configured { background: #1e1e28; color: #888; }
  .status-badge.error { background: #3a1515; color: #f06060; }
  .status-badge.testing { background: #1a2030; color: #6b9eff; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .card-buttons { display: flex; flex-direction: column; gap: 6px; }

  .btn {
    padding: 7px 12px; border-radius: 7px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: all 0.15s; text-align: center;
  }
  .btn-primary { background: #3b5bdb; color: #fff; }
  .btn-primary:hover { background: #4c6ef5; }
  .btn-secondary { background: #2a2d3e; color: #ccc; }
  .btn-secondary:hover { background: #343748; }
  .btn-danger { background: #3a1515; color: #f06060; }
  .btn-danger:hover { background: #4a1e1e; }
  .btn-success { background: #0d3320; color: #4caf7d; }
  .btn-success:hover { background: #144428; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Publish Panel */
  .publish-panel {
    background: #1a1d2e;
    border: 1px solid #2a2d3e;
    border-radius: 12px;
    padding: 20px;
  }

  .platform-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .platform-check-label {
    display: flex; align-items: center; gap: 6px;
    background: #2a2d3e; border-radius: 6px; padding: 6px 10px;
    cursor: pointer; font-size: 13px; transition: background 0.15s;
    user-select: none;
  }
  .platform-check-label:hover { background: #343748; }
  .platform-check-label input { accent-color: #4c6ef5; }

  textarea {
    width: 100%; background: #0f1117; border: 1px solid #2a2d3e;
    border-radius: 8px; padding: 12px; color: #e0e0e0; font-size: 14px;
    resize: vertical; min-height: 100px; outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: #3b5bdb; }

  .file-upload-area {
    border: 1px dashed #2a2d3e; border-radius: 8px; padding: 16px;
    text-align: center; cursor: pointer; margin: 12px 0;
    transition: border-color 0.15s; color: #888; font-size: 13px;
  }
  .file-upload-area:hover { border-color: #3b5bdb; color: #ccc; }
  .file-upload-area input { display: none; }
  .file-preview { margin-top: 8px; font-size: 12px; color: #4caf7d; }

  .publish-actions { display: flex; gap: 10px; margin-top: 16px; }
  .publish-actions .btn { flex: 1; padding: 10px; font-size: 14px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 14px;
    padding: 24px; width: 100%; max-width: 480px; max-height: 90vh;
    overflow-y: auto; position: relative;
  }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .modal .modal-subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: #888; font-size: 20px;
    cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: #fff; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; font-weight: 500; }
  .form-group input {
    width: 100%; background: #0f1117; border: 1px solid #2a2d3e;
    border-radius: 7px; padding: 9px 12px; color: #e0e0e0; font-size: 14px; outline: none;
  }
  .form-group input:focus { border-color: #3b5bdb; }

  .instruction-box {
    background: #0f1117; border: 1px solid #2a2d3e; border-radius: 8px;
    padding: 12px 14px; font-size: 12px; color: #aaa; line-height: 1.7;
    margin-bottom: 16px;
  }
  .instruction-box strong { color: #ddd; }
  .instruction-box a { color: #6b9eff; text-decoration: none; }
  .instruction-box a:hover { text-decoration: underline; }
  .instruction-box ol, .instruction-box ul { padding-left: 16px; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; padding: 10px; }

  /* Schedule Modal */
  .schedule-modal .form-group input[type="datetime-local"] {
    color-scheme: dark;
  }

  /* Results */
  .results-panel {
    margin-top: 16px; display: none;
  }
  .result-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 8px; margin-bottom: 6px;
    font-size: 13px;
  }
  .result-item.ok { background: #0d3320; }
  .result-item.error { background: #3a1515; }
  .result-icon { font-size: 16px; }

  /* Jobs list */
  .jobs-list { margin-top: 12px; }
  .job-item {
    background: #0f1117; border: 1px solid #2a2d3e; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 6px; display: flex;
    justify-content: space-between; align-items: center; font-size: 13px;
  }
  .job-info { flex: 1; }
  .job-time { color: #6b9eff; font-size: 12px; margin-top: 2px; }
  .job-platforms { color: #888; font-size: 11px; }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #333; border-top-color: #6b9eff;
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1a1d2e; border: 1px solid #2a2d3e;
    border-radius: 10px; padding: 12px 18px; font-size: 14px;
    z-index: 200; opacity: 0; transition: opacity 0.2s;
    max-width: 320px;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: #1d6b3f; color: #4caf7d; }
  .toast.error { border-color: #6b2020; color: #f06060; }
</style>
</head>
<body>

<header>
  <div>
    <h1>🚀 Social Networks Auto-Poster</h1>
    <div class="subtitle">Управление публикациями в социальных сетях</div>
  </div>
</header>

<div class="container">

  <div class="section-title">Подключённые платформы</div>
  <div class="platforms-grid" id="platformsGrid"></div>

  <div class="section-title">Публикация</div>
  <div class="publish-panel">
    <div class="platform-checkboxes" id="platformCheckboxes"></div>
    <textarea id="postText" placeholder="Текст публикации..."></textarea>

    <label class="file-upload-area" id="fileDropArea">
      <input type="file" id="fileInput" accept="image/*,video/*">
      <span id="fileLabel">📎 Прикрепить фото или видео</span>
      <div class="file-preview" id="filePreview"></div>
    </label>

    <div class="publish-actions">
      <button class="btn btn-primary" onclick="publishNow()">▶ Опубликовать сейчас</button>
      <button class="btn btn-secondary" onclick="openScheduleModal()">🕐 По расписанию</button>
    </div>

    <div class="results-panel" id="resultsPanel"></div>
  </div>

</div>

<!-- Connect Modals -->
<div class="modal-overlay" id="connectModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('connectModal')">×</button>
    <h2 id="modalTitle">Подключить</h2>
    <div class="modal-subtitle" id="modalSubtitle"></div>
    <div id="modalInstruction" class="instruction-box"></div>
    <div id="modalForm"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('connectModal')">Отмена</button>
      <button class="btn btn-primary" onclick="saveConnect()">Сохранить</button>
    </div>
  </div>
</div>

<!-- Schedule Modal -->
<div class="modal-overlay schedule-modal" id="scheduleModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('scheduleModal')">×</button>
    <h2>Запланировать публикацию</h2>
    <div class="modal-subtitle">Пост будет отправлен в указанное время</div>
    <div class="form-group">
      <label>Дата и время</label>
      <input type="datetime-local" id="scheduleTime">
    </div>
    <div class="section-title" style="margin-top:16px">Запланированные задачи</div>
    <div class="jobs-list" id="jobsList"><div style="color:#888;font-size:13px">Нет задач</div></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('scheduleModal')">Отмена</button>
      <button class="btn btn-primary" onclick="schedulePost()">Запланировать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PLATFORMS = {
  telegram: {
    name: "Telegram",
    icon: "✈️",
    color: "#2196F3",
    fields: [
      { key: "bot_token", label: "Bot Token", placeholder: "123456789:AABBCCDDEEFFaabbccddeeff" },
      { key: "chat_id", label: "Chat ID (канала/группы)", placeholder: "-1001234567890" },
    ],
    instruction: `
      <strong>Как получить Bot Token:</strong>
      <ol>
        <li>Открыть Telegram → найти <strong>@BotFather</strong></li>
        <li>Отправить <code>/newbot</code> → ввести имя → ввести username (заканчивается на <code>bot</code>)</li>
        <li>BotFather вернёт <strong>Bot Token</strong></li>
      </ol>
      <br>
      <strong>Как получить Chat ID канала:</strong>
      <ol>
        <li>Добавить бота в канал как <strong>администратора</strong></li>
        <li>Переслать любое сообщение из канала боту <strong>@userinfobot</strong></li>
        <li>Он вернёт chat_id (начинается с <code>-100</code>)</li>
      </ol>
    `
  },
  vk: {
    name: "VKontakte",
    icon: "🔵",
    color: "#4a76a8",
    fields: [
      { key: "access_token", label: "Community Token", placeholder: "vk1.a.xxxxx" },
      { key: "target_id", label: "ID группы/паблика (куда постить)", placeholder: "-123456789" },
    ],
    instruction: `
      <strong>Получить Community Token:</strong>
      <ol>
        <li>Группа → <strong>Управление → Настройки → Работа с API</strong></li>
        <li><strong>Создать ключ</strong> → ✅ Управление сообществом + ✅ Стена + ✅ Фотографии</li>
        <li>Вставьте токен выше</li>
      </ol>
      <br>
      <strong>ID группы:</strong> отрицательное число. URL <code>club123456</code> → ID = <code>-123456</code>
    `
  },
  ok: {
    name: "Одноклассники",
    icon: "🟠",
    color: "#f7931e",
    fields: [
      { key: "access_token", label: "Access Token", placeholder: "xxxxx" },
      { key: "session_secret_key", label: "Session Secret Key", placeholder: "xxxxx" },
      { key: "application_key", label: "Application Key (публичный)", placeholder: "ABCDEFGHIJKLMN" },
      { key: "secret_key", label: "Secret Key (приватный)", placeholder: "xxxxx" },
      { key: "group_id", label: "Group ID (без знака)", placeholder: "123456789" },
    ],
    instruction: `
      <strong>Регистрация и получение ключей:</strong>
      <ol>
        <li>Получить права разработчика: <a href="https://ok.ru/devaccess" target="_blank">ok.ru/devaccess</a></li>
        <li>Создать приложение: <a href="https://ok.ru/vitrine/myuploaded" target="_blank">ok.ru/vitrine/myuploaded</a> → «В разработке» → «Добавить приложение»</li>
        <li>Заполнить название, добавить платформу OAuth</li>
        <li>После создания <strong>на email придут</strong> <code>application_key</code> и <code>secret_key</code></li>
      </ol>
      <br>
      <strong>Получить Access Token:</strong>
      <ol>
        <li>Открыть настройки приложения → внизу блок <strong>«Вечный access_token»</strong></li>
        <li>Сгенерировать пару <code>access_token</code> + <code>session_secret_key</code></li>
      </ol>
    `
  },
  facebook: {
    name: "Facebook",
    icon: "📘",
    color: "#1877f2",
    fields: [
      { key: "page_access_token", label: "Page Access Token", placeholder: "EAAxxxxx" },
      { key: "page_id", label: "Page ID", placeholder: "123456789012345" },
    ],
    instruction: `
      <strong>Как получить токены:</strong>
      <ol>
        <li>Создать приложение: <a href="https://developers.facebook.com/apps" target="_blank">developers.facebook.com/apps</a> → Create App → тип <strong>Business</strong></li>
        <li>Открыть <a href="https://developers.facebook.com/tools/explorer" target="_blank">Graph Explorer</a></li>
        <li>Выбрать своё приложение → выдать permissions: <code>pages_manage_posts</code>, <code>pages_read_engagement</code></li>
        <li>Нажать <strong>Generate Access Token</strong></li>
        <li>Выполнить запрос <code>GET /me/accounts</code> → найти страницу → скопировать <code>id</code> (Page ID) и <code>access_token</code></li>
      </ol>
      <br>
      ⚠️ User Access Token краткосрочный (~1ч). Для постоянной работы обменяйте на Long-Lived Token.
    `
  },
  instagram: {
    name: "Instagram",
    icon: "📸",
    color: "#e1306c",
    fields: [
      { key: "access_token", label: "Access Token (Page Access Token)", placeholder: "EAAxxxxx" },
      { key: "user_id", label: "Instagram User ID", placeholder: "17841400000000000" },
    ],
    instruction: `
      <strong>Требования:</strong> Business или Creator аккаунт, привязанный к Facebook Page.
      <br><br>
      <strong>Как получить Instagram User ID:</strong>
      <ol>
        <li>В <a href="https://developers.facebook.com/tools/explorer" target="_blank">Graph Explorer</a> выполнить: <code>GET /{page-id}?fields=instagram_business_account</code></li>
        <li>Скопировать <code>instagram_business_account.id</code></li>
      </ol>
      <br>
      <strong>Access Token</strong> — тот же Page Access Token что и для Facebook.
      <br><br>
      ⚠️ Для постинга медиа нужен <strong>публичный HTTPS URL</strong> изображения — локальные файлы не принимаются.
    `
  },
  twitter: {
    name: "X (Twitter)",
    icon: "🐦",
    color: "#1da1f2",
    fields: [
      { key: "api_key", label: "API Key", placeholder: "xxxxx" },
      { key: "api_secret", label: "API Secret", placeholder: "xxxxx" },
      { key: "access_token", label: "Access Token", placeholder: "xxxxx" },
      { key: "access_token_secret", label: "Access Token Secret", placeholder: "xxxxx" },
    ],
    instruction: `
      <strong>Регистрация:</strong>
      <ol>
        <li><a href="https://developer.x.com/en/portal/petition/essential/basic-info" target="_blank">Зарегистрироваться как разработчик</a> (нужен подтверждённый email и телефон)</li>
        <li>Создать Project и App: <a href="https://developer.x.com/en/portal/projects-and-apps" target="_blank">Projects & Apps</a> → New Project → New App</li>
        <li>В настройках App → <strong>Keys and Tokens</strong>:</li>
        <ul>
          <li>Скопировать <strong>API Key & Secret</strong> (показываются <u>один раз</u>!)</li>
          <li>Нажать Generate → <strong>Access Token & Secret</strong></li>
        </ul>
        <li><strong>User authentication settings</strong> → включить Read and Write</li>
      </ol>
    `
  },
  zen: {
    name: "Яндекс Дзен",
    icon: "🟡",
    color: "#fc0",
    fields: [
      { key: "feed_title", label: "Название канала", placeholder: "Мой Дзен Канал" },
      { key: "author_name", label: "Имя автора", placeholder: "Автор" },
    ],
    instruction: `
      <strong>Яндекс Дзен использует RSS-импорт</strong> (публичного API нет).
      <br><br>
      <strong>Как настроить:</strong>
      <ol>
        <li>После сохранения имени канала посты будут добавляться в RSS-ленту</li>
        <li>RSS-файл будет доступен по адресу: <code>http://ваш-сервер:8000/static/rss.xml</code></li>
        <li>Открыть <strong>Дзен Studio</strong> → Настройки → <strong>Импорт из RSS</strong></li>
        <li>Указать URL вашей RSS-ленты</li>
      </ol>
      <br>
      Дзен проверяет ленту раз в несколько часов.
    `
  }
};

let currentPlatform = null;
let statuses = {};

// Init
async function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('vk_connected')) {
    history.replaceState({}, '', '/');
    setTimeout(() => showToast('VK успешно подключён!', 'ok'), 300);
  } else if (params.get('vk_error')) {
    history.replaceState({}, '', '/');
    setTimeout(() => showToast('Ошибка подключения VK: ' + params.get('vk_error'), 'error'), 300);
  }
  renderPlatformGrid();
  renderCheckboxes();
  await loadStatuses();
  await loadJobs();
}

function renderPlatformGrid() {
  const grid = document.getElementById('platformsGrid');
  grid.innerHTML = Object.entries(PLATFORMS).map(([key, p]) => `
    <div class="platform-card" id="card-${key}">
      <div class="platform-card-header">
        <div class="platform-icon" style="background:${p.color}22">${p.icon}</div>
        <div class="platform-name">${p.name}</div>
      </div>
      <div class="status-badge not_configured" id="status-${key}">
        <span class="status-dot"></span>
        <span id="status-text-${key}">Не настроено</span>
      </div>
      <div class="card-buttons">
        <button class="btn btn-secondary" onclick="testPlatform('${key}')">🔍 Проверить</button>
        <button class="btn btn-primary" onclick="openConnect('${key}')">🔗 Подключить</button>
        <button class="btn btn-danger" onclick="resetPlatform('${key}')">🗑 Сбросить</button>
      </div>
    </div>
  `).join('');
}

function renderCheckboxes() {
  const container = document.getElementById('platformCheckboxes');
  container.innerHTML = Object.entries(PLATFORMS).map(([key, p]) => `
    <label class="platform-check-label">
      <input type="checkbox" value="${key}" name="platform">
      ${p.icon} ${p.name}
    </label>
  `).join('');
}

async function loadStatuses() {
  try {
    const res = await fetch('/api/status');
    statuses = await res.json();
    for (const [key, status] of Object.entries(statuses)) {
      updateStatusBadge(key, status);
    }
  } catch(e) {}
}

function updateStatusBadge(platform, status, message) {
  const badge = document.getElementById(`status-${platform}`);
  const text = document.getElementById(`status-text-${platform}`);
  const card = document.getElementById(`card-${platform}`);
  if (!badge) return;

  badge.className = 'status-badge ' + status;
  card.className = 'platform-card ' + (status === 'connected' ? 'connected' : '');

  const labels = {
    connected: '● Подключено',
    not_configured: '○ Не настроено',
    error: '⚠ Ошибка',
    testing: '⏳ Проверка...'
  };
  text.textContent = message || labels[status] || status;
}

// Connect modal
function openConnect(platform) {
  currentPlatform = platform;
  const p = PLATFORMS[platform];
  document.getElementById('modalTitle').textContent = `Подключить ${p.name}`;
  document.getElementById('modalSubtitle').textContent = `Введите данные для авторизации`;
  document.getElementById('modalInstruction').innerHTML = p.instruction;

  // Try to prefill from saved data
  fetch('/api/status').then(() => {});

  document.getElementById('modalForm').innerHTML = p.fields.map(f => `
    <div class="form-group">
      <label>${f.label}</label>
      <input type="text" id="field-${f.key}" placeholder="${f.placeholder}" autocomplete="off">
    </div>
  `).join('');

  const saveBtn = document.querySelector('#connectModal .modal-actions .btn-primary');
  saveBtn.textContent = p.oauthFlow ? '🔗 Сохранить и войти через VK' : 'Сохранить';

  document.getElementById('connectModal').classList.add('active');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function saveConnect() {
  const p = PLATFORMS[currentPlatform];
  const data = {};
  for (const f of p.fields) {
    const val = document.getElementById(`field-${f.key}`)?.value?.trim();
    if (!val && !(p.oauthFlow && f.key === 'access_token')) {
      showToast('Заполните все поля', 'error'); return;
    }
    if (val) data[f.key] = val;
  }

  const res = await fetch(`/api/connect/${currentPlatform}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const json = await res.json();
  if (!json.ok) { showToast('Ошибка сохранения', 'error'); return; }

  if (p.oauthFlow && !data.access_token) {
    window.location.href = `/oauth/${currentPlatform}`;
  } else {
    closeModal('connectModal');
    updateStatusBadge(currentPlatform, 'configured');
    showToast(`${p.name} сохранён`, 'ok');
    await loadStatuses();
  }
}

async function testPlatform(platform) {
  updateStatusBadge(platform, 'testing');
  try {
    const res = await fetch(`/api/test/${platform}`, { method: 'POST' });
    const data = await res.json();
    updateStatusBadge(platform, data.ok ? 'connected' : 'error', data.ok ? data.message : data.message);
    showToast(data.message || (data.ok ? 'OK' : 'Ошибка'), data.ok ? 'ok' : 'error');
  } catch(e) {
    updateStatusBadge(platform, 'error', 'Ошибка запроса');
  }
}

async function resetPlatform(platform) {
  if (!confirm(`Сбросить подключение к ${PLATFORMS[platform].name}?`)) return;
  await fetch(`/api/connect/${platform}`, { method: 'DELETE' });
  updateStatusBadge(platform, 'not_configured');
  showToast(`${PLATFORMS[platform].name} отключён`, 'ok');
}

// Publish
async function publishNow() {
  const text = document.getElementById('postText').value.trim();
  const platforms = getSelectedPlatforms();
  if (!text) { showToast('Введите текст', 'error'); return; }
  if (!platforms.length) { showToast('Выберите платформы', 'error'); return; }

  const formData = new FormData();
  formData.append('text', text);
  platforms.forEach(p => formData.append('platforms', p));

  const file = document.getElementById('fileInput').files[0];
  if (file) formData.append('file', file);

  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';
  panel.innerHTML = '<div class="spinner"></div> Публикация...';

  const res = await fetch('/api/post', { method: 'POST', body: formData });
  const results = await res.json();

  panel.innerHTML = Object.entries(results).map(([p, r]) => `
    <div class="result-item ${r.ok ? 'ok' : 'error'}">
      <span class="result-icon">${r.ok ? '✅' : '❌'}</span>
      <span><strong>${PLATFORMS[p]?.name || p}</strong>: ${r.message || (r.ok ? `Пост ID: ${r.post_id}` : 'Ошибка')}</span>
    </div>
  `).join('');
}

// Schedule
function openScheduleModal() {
  const dt = new Date(Date.now() + 3600000);
  document.getElementById('scheduleTime').value = dt.toISOString().slice(0, 16);
  loadJobs();
  document.getElementById('scheduleModal').classList.add('active');
}

async function schedulePost() {
  const text = document.getElementById('postText').value.trim();
  const platforms = getSelectedPlatforms();
  const runAt = document.getElementById('scheduleTime').value;

  if (!text) { showToast('Введите текст', 'error'); return; }
  if (!platforms.length) { showToast('Выберите платформы', 'error'); return; }
  if (!runAt) { showToast('Укажите время', 'error'); return; }

  const formData = new FormData();
  formData.append('text', text);
  platforms.forEach(p => formData.append('platforms', p));
  formData.append('run_at', new Date(runAt).toISOString());

  const res = await fetch('/api/schedule', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.ok) {
    showToast('Задача запланирована', 'ok');
    loadJobs();
  }
}

async function loadJobs() {
  const res = await fetch('/api/jobs');
  const jobs = await res.json();
  const list = document.getElementById('jobsList');
  if (!jobs.length) {
    list.innerHTML = '<div style="color:#888;font-size:13px">Нет задач</div>';
    return;
  }
  list.innerHTML = jobs.map(j => `
    <div class="job-item">
      <div class="job-info">
        <div>${j.text || '(без текста)'}</div>
        <div class="job-time">⏰ ${new Date(j.run_at).toLocaleString('ru')}</div>
        <div class="job-platforms">${j.platforms?.map(p => PLATFORMS[p]?.name || p).join(', ')}</div>
      </div>
      <button class="btn btn-danger" style="padding:5px 10px;font-size:12px" onclick="cancelJob('${j.id}')">Отменить</button>
    </div>
  `).join('');
}

async function cancelJob(id) {
  await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
  loadJobs();
}

function getSelectedPlatforms() {
  return [...document.querySelectorAll('input[name="platform"]:checked')].map(el => el.value);
}

// File input
document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  document.getElementById('filePreview').textContent = file ? `📎 ${file.name}` : '';
});

// Toast
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
});

init();
</script>
